 * This generated file contains a sample Java Library project to get you started.
 * For more details take a look at the Java Libraries chapter in the Gradle
 * user guide available at https://docs.gradle.org/4.3/userguide/java_library_plugin.html
 */

// Apply the java-library plugin to add support for Java Library
apply plugin: 'java-library'
apply plugin: 'eclipse'

// Project archive version. Hand-maintained in lockstep with the canonical
// source of truth in `srcs/CMakeLists.txt` (project(heif VERSION ...)) and
// `srcs/api-java/java/com/nokia/heif/BuildInfo.java`. Producing
// `build/libs/heif-<version>.jar` matches the filename pattern documented
// in `wiki/04-java-and-android.md`.
version = '4.0.0'
archivesBaseName = 'heif'

// In this section you declare where to find the dependencies of your project
repositories {
    // Use mavenCentral for resolving your dependencies.
    mavenCentral()
}

tasks.withType(JavaCompile) {
    sourceCompatibility = "1.8"
    targetCompatibility = "1.8"
}



def projectDir = getProjectDir().absolutePath
def rootPath = file(projectDir + "/../../").path

def javaApiSourcePath = file(rootPath + "/srcs/api-java/").path
def javaApiJavaPath = file(javaApiSourcePath + "/java/").path


def nativeBuildPathWindows = file(rootPath + "/build/lib").path
def nativeBuildPathLinux = file(rootPath + "/build/lib").path

sourceSets.main {
   java.srcDirs = [javaApiJavaPath]
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:32.1.3-jre'
}

